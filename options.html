<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onvord Settings</title>
    <style>
        :root {
            --bg: #eef3f8;
            --surface: #ffffff;
            --surface-2: #f7fafc;
            --line: #d8e2ec;
            --line-strong: #c5d5e5;
            --text: #102a43;
            --muted: #52667a;
            --muted-soft: #7b8ea4;
            --ac: #0b5fff;
            --ach: #2f80ff;
            --ac-g: rgba(11, 95, 255, 0.2);
            --ok: #1f9d68;
            --dn: #e5484d;
            --warn: #9a5700;
            --warn-bg: rgba(255, 163, 53, 0.12);
            --f-title: "Nunito Sans", "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --f-body: "Public Sans", "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--f-body);
            background:
                radial-gradient(circle at 92% 5%, rgba(11, 95, 255, 0.13) 0%, transparent 34%),
                linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 34px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 760px;
            width: 100%;
        }

        .stack {
            display: grid;
            gap: 12px;
        }

        .head,
        .card {
            border-radius: 18px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 24px rgba(12, 27, 61, 0.08);
        }

        .head {
            padding: 16px 18px;
            margin-bottom: 14px;
        }

        .card {
            padding: 16px;
            margin-bottom: 12px;
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            border: 1px solid var(--line-strong);
            background: #f4f8fd;
            color: #3c5471;
            padding: 4px 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 10px;
            margin-bottom: 8px;
            font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace;
        }

        h1 {
            font-family: var(--f-title);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 6px;
            color: #113252;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.65;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #46617e;
            margin-bottom: 6px;
        }

        .card-subtitle {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
            margin-bottom: 14px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 680px) {
            .field-row {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 11px 12px;
            background: var(--surface-2);
            border: 1px solid #d3e1ef;
            border-radius: 10px;
            color: #173453;
            font-family: var(--f-body);
            font-size: 14px;
            outline: none;
            transition: 150ms ease;
        }

        input:focus,
        select:focus {
            border-color: var(--ac);
            box-shadow: 0 0 0 3px var(--ac-g);
            background: #ffffff;
        }

        input::placeholder {
            color: var(--muted-soft);
        }

        .hint {
            font-size: 12px;
            color: var(--muted-soft);
            margin-top: 6px;
            line-height: 1.65;
        }

        .badge {
            min-height: 44px;
            border-radius: 10px;
            border: 1px solid #d5e2ef;
            background: #f8fbff;
            color: #25415f;
            padding: 11px 12px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .badge.ok {
            border-color: rgba(31, 157, 104, 0.24);
            background: rgba(31, 157, 104, 0.08);
            color: var(--ok);
        }

        .badge.warn {
            border-color: rgba(255, 163, 53, 0.24);
            background: var(--warn-bg);
            color: var(--warn);
        }

        .badge.err {
            border-color: rgba(229, 72, 77, 0.24);
            background: rgba(229, 72, 77, 0.08);
            color: var(--dn);
        }

        .summary {
            border: 1px solid #dce7f2;
            background: #f8fbff;
            border-radius: 12px;
            padding: 12px 13px;
            color: #244462;
            font-size: 13px;
            line-height: 1.75;
            margin-top: 12px;
        }

        .summary.billing {
            margin-top: 0;
        }

        .summary.setting-note {
            margin-top: 0;
            color: var(--muted);
        }

        .account-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #d9e8ff, #edf5ff);
            border: 1px solid #d5e2ef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #31506d;
            font-weight: 700;
            overflow: hidden;
            flex: 0 0 auto;
            position: relative;
        }

        .avatar img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 160ms ease;
        }

        .avatar.has-image img {
            opacity: 1;
        }

        .account-meta {
            min-width: 0;
            flex: 1 1 auto;
        }

        .account-name {
            font-size: 15px;
            font-weight: 700;
            color: #183552;
            margin-bottom: 2px;
        }

        .account-email {
            font-size: 13px;
            color: var(--muted);
            word-break: break-all;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: 1px solid transparent;
            border-radius: 11px;
            font-family: var(--f-body);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 150ms ease;
        }

        .btn-primary {
            background: linear-gradient(120deg, var(--ac), var(--ach));
            color: #fff;
            box-shadow: 0 10px 20px var(--ac-g);
        }

        .btn-sec {
            background: #ffffff;
            color: #314b66;
            border-color: #d5e2ef;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn.is-loading {
            cursor: progress;
        }

        .status {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .status.ok {
            display: block;
            background: rgba(31, 157, 104, 0.08);
            border: 1px solid rgba(31, 157, 104, 0.26);
            color: var(--ok);
        }

        .status.err {
            display: block;
            background: rgba(229, 72, 77, 0.08);
            border: 1px solid rgba(229, 72, 77, 0.26);
            color: var(--dn);
        }

        .hidden {
            display: none !important;
        }

        .status-group {
            display: grid;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="head">
            <p class="kicker" id="opt-kicker">Settings</p>
            <h1 id="opt-title">Onvord</h1>
            <p class="subtitle" id="opt-subtitle">管理录制语言、访问状态和订阅。</p>
        </div>

        <div class="stack">
            <div class="card">
                <div class="card-title" id="opt-card-account">Account & Recovery</div>
                <p class="card-subtitle" id="opt-card-account-subtitle">用 Google 登录绑定订阅。重装插件或换设备后，也能恢复你的权限。</p>
                <div class="status-group">
                    <div class="field">
                        <label id="opt-label-account">Account</label>
                        <div class="badge" id="account-badge">Checking account</div>
                    </div>
                    <div class="account-row">
                        <div class="avatar" id="account-avatar">O</div>
                        <div class="account-meta">
                            <div class="account-name" id="account-name">Onvord</div>
                            <div class="account-email" id="account-email">-</div>
                        </div>
                    </div>
                    <div class="summary" id="account-summary">
                        正在检查当前账号状态。
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="btn-google-signin">Continue with Google</button>
                    <button class="btn btn-sec hidden" id="btn-sign-out">Sign out</button>
                </div>
            </div>

            <div class="card hidden" id="billing-card">
                <div class="card-title" id="opt-card-billing">Subscription & Billing</div>
                <p class="card-subtitle" id="opt-card-billing-subtitle">查看订阅状态、刷新权限，并在需要时管理账单。</p>
                <div class="status-group">
                    <div class="field">
                        <label id="opt-label-status">Access Status</label>
                        <div class="badge" id="access-badge">Checking status</div>
                    </div>
                    <div class="summary billing" id="access-summary">
                        正在检查当前状态。
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn btn-sec" id="btn-refresh">Refresh</button>
                    <button class="btn btn-sec hidden" id="btn-open-checkout">Subscribe</button>
                    <button class="btn btn-sec hidden" id="btn-open-portal">Manage Subscription</button>
                </div>
            </div>

            <div class="card hidden" id="recording-card">
                <div class="card-title" id="opt-card-recording">Recording Preferences</div>
                <p class="card-subtitle" id="opt-card-recording-subtitle">管理录制时使用的语言设置。这里不会影响你的订阅和账单。</p>
                <div class="field">
                    <label for="commercial-language" id="opt-label-language">Recording Language</label>
                    <select id="commercial-language">
                        <option value="zh-CN">中文</option>
                        <option value="en-US">English</option>
                    </select>
                </div>
                <div class="summary setting-note" id="recording-note">
                    修改后会应用到后续新的录制会话。
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="btn-save">Save</button>
                </div>
            </div>

            <div class="status" id="status"></div>
        </div>
    </div>
    <script src="commercial-config.js"></script>
    <script src="commercial.js"></script>
    <script src="options.js"></script>
</body>

</html>
